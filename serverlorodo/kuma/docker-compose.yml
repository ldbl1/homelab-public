services:
  uptime-kuma:
    image: louislam/uptime-kuma:${KUMA_VERSION}
    container_name: uptime-kuma
    restart: unless-stopped
    dns:
      - 192.168.1.2
    ports:
      - "${KUMA_PORT}:3001"
    volumes:
      - "${KUMA_DATA}:/app/data"
      - /var/run/docker.sock:/var/run/docker.sock:ro
