  searchDescriptions: true
  hideInternetSearch: true
  showSearchSuggestions: true
  hideVisitURL: true
  provider: google

statusStyle: "dot"

disableIndexing: true


layout:
  Notificaciones:
    style: row
    columns: 1

  Casa:
    style: row
    columns: 4     

  Descargas y automatización:
    style: row
    columns: 2

  3D:
    style: row
    columns: 2

  Documentación:
    style: row
    columns: 1

  Administración serverlorodo:
    initiallyCollapsed: true
    style: row
    columns: 2

  Administración pilorodo:
    initiallyCollapsed: true
    style: row
    columns: 2
