services:
  db:
    image: postgres:16-alpine
    container_name: thingport-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: "${POSTGRES_USER:-thingport}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-thingport}"

    volumes:
      - /mnt/raid1/thingport/database:/var/lib/postgresql/data

    networks:
      - thingport-net

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-thingport}
      interval: 5s
      timeout: 5s
      retries: 10


  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: thingport-flaresolverr
    restart: unless-stopped

    environment:
      LOG_LEVEL: "${FLARESOLVERR_LOG_LEVEL:-info}"
      TZ: "${TZ:-Europe/Madrid}"

    networks:
      - thingport-net


  backend:
    image: ghcr.io/tautvydasderzinskas/thingport-backend:latest
    container_name: thingport-backend
    restart: unless-stopped

    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"

      AUTH_SECRET: "${AUTH_SECRET}"
      AUTH_TOKEN_TTL: "${AUTH_TOKEN_TTL:-43200}"

      PUBLIC_URL: "${PUBLIC_URL:-}"

      FILE_STORAGE: "/app/storage"

      DATABASE_URL: "postgresql://${POSTGRES_USER:-thingport}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-thingport}?schema=public"

      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      FLARESOLVERR_URL: "${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}"

      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-Thingport <no-reply@localhost>}"

      TZ: "${TZ:-Europe/Madrid}"

    depends_on:
      db:
        condition: service_healthy
      flaresolverr:
        condition: service_started

    volumes:
      - /mnt/raid1/media/3dmodels:/app/storage

    networks:
      - thingport-net


  frontend:
    image: ghcr.io/tautvydasderzinskas/thingport-frontend:latest
    container_name: thingport-frontend
    restart: unless-stopped

    ports:
      - "${WEB_PORT:-3458}:80"

    depends_on:
      - backend

    networks:
      - thingport-net


networks:
  thingport-net:
    driver: bridge
