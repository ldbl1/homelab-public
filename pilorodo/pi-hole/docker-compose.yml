services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest

    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE

    network_mode: host

    environment:
      TZ: "Europe/Madrid"
      WEBPASSWORD: "PIHOLE-PASSWORD"
      DNS1: 1.1.1.1
      DNS2: 8.8.8.8

    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d

    restart: unless-stopped